<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SFK - Sevdamız Futbol Taktik Merkezi</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b131a;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: white;
            position: relative;
            overflow: hidden;
        }
        
        .bg-watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 35vw;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.03);
            z-index: 0;
            pointer-events: none;
            letter-spacing: -10px;
            white-space: nowrap;
        }

        .content-wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .header-title {
            text-align: center;
            margin-bottom: 50px;
        }

        .kurulus {
            color: #d4af37;
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 5px;
            display: block;
        }

        .header-title h1 {
            font-size: 42px;
            color: #ecf0f1;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        .header-title h2 {
            color: #bdc3c7;
            margin-top: 5px;
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            max-width: 650px;
            width: 90%;
        }

        .panel {
            background: linear-gradient(145deg, #16222d, #121c25);
            border: 1px solid #2c3e50;
            border-radius: 15px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            position: relative;
            overflow: hidden;
        }

        .panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: #d4af37;
            transform: scaleX(0);
            transition: transform 0.4s ease;
        }

        .panel:hover::before {
            transform: scaleX(1);
        }

        .panel:hover {
            transform: translateY(-8px);
            border-color: #d4af37;
            box-shadow: 0 15px 30px rgba(212, 175, 55, 0.15);
        }

        .panel h3 {
            margin: 0;
            font-size: 28px;
            color: #ecf0f1;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        .panel:hover h3 {
            color: #d4af37;
        }

        /* Özel Şifre Modalı (Mavikent Elite Tarzı) */
        .modal-overlay {
            display: none; /* Varsayılan olarak gizli */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal-box {
            background: linear-gradient(145deg, #16222d, #121c25);
            border: 1px solid #d4af37;
            border-radius: 15px;
            padding: 30px 40px;
            text-align: center;
            width: 300px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            position: relative;
            animation: modalFadeIn 0.3s ease;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-box h3 {
            margin-top: 0;
            color: #d4af37;
            font-size: 22px;
            margin-bottom: 20px;
        }

        .modal-box input {
            width: 90%;
            padding: 12px;
            margin-bottom: 20px;
            background-color: #0b131a;
            border: 1px solid #2c3e50;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            text-align: center;
            letter-spacing: 2px;
        }

        .modal-box input:focus {
            outline: none;
            border-color: #d4af37;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn-cancel {
            background-color: #2c3e50;
            color: white;
        }

        .btn-cancel:hover {
            background-color: #e74c3c;
        }

        .btn-submit {
            background-color: #d4af37;
            color: #0b131a;
        }

        .btn-submit:hover {
            background-color: #f1c40f;
        }

        .error-msg {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="bg-watermark">SFK</div>

    <div class="content-wrapper">
        <div class="header-title">
            <span class="kurulus">EST. 2016</span>
            <h1>Sevdamız Futbol</h1>
            <h2>OSM Taktik & Analiz Merkezi</h2>
        </div>

        <div class="grid-container">
            <div class="panel" onclick="openModal('SFK (T)', '1071')">
                <h3>SFK (T)</h3>
            </div>
            <div class="panel" onclick="openModal('SFK (V)', '1453')">
                <h3>SFK (V)</h3>
            </div>
            <div class="panel" onclick="openModal('SFK (Y)', '1881')">
                <h3>SFK (Y)</h3>
            </div>
            <div class="panel" onclick="openModal('SFK (Z)', '1923')">
                <h3>SFK (Z)</h3>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="loginModal">
        <div class="modal-box">
            <h3 id="modalTitle">Grup Adı</h3>
            <input type="password" id="passwordInput" placeholder="Şifrenizi Girin" autocomplete="off">
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeModal()">İptal</button>
                <button class="btn-submit" onclick="verifyPassword()">Giriş</button>
            </div>
            <div class="error-msg" id="errorMsg">Hatalı şifre, tekrar deneyin.</div>
        </div>
    </div>

    <script>
        let currentGroup = '';
        let currentPassword = '';

        function openModal(groupName, correctPassword) {
            currentGroup = groupName;
            currentPassword = correctPassword;
            
            document.getElementById('modalTitle').innerText = groupName;
            document.getElementById('passwordInput').value = '';
            document.getElementById('errorMsg').style.display = 'none';
            
            document.getElementById('loginModal').style.display = 'flex';
            document.getElementById('passwordInput').focus();
        }

        function closeModal() {
            document.getElementById('loginModal').style.display = 'none';
        }

        function verifyPassword() {
            const enteredPassword = document.getElementById('passwordInput').value;
            
            if (enteredPassword === currentPassword) {
                window.location.href = "taktik.html?grup=" + currentGroup.replace(/ /g, '');
            } else {
                document.getElementById('errorMsg').style.display = 'block';
                document.getElementById('passwordInput').value = '';
                document.getElementById('passwordInput').focus();
            }
        }

        // Enter tuşuna basıldığında da giriş yapsın
        document.getElementById('passwordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                verifyPassword();
            }
        });
    </script>

</body>
</html>
